<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>WHOJ Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,700;6..12,900&display=swap">
<style>
:root {
  --bg: #0e1616; --side: #0a1010; --surface: #142020; --fg: #e4eded; --muted: #8da1a1; --line: #263636;
  --accent: #94e3e3; --accent-fill: #009494; --deep: #004343; --live: #8ff0b8; --off: #c9a46a; --bad: #ff9b8a;
  --font: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 300; line-height: 1.45; }
h1, h2, h3 { margin: 0; font-weight: 900; }
a { color: var(--accent); font-weight: 700; }
button, input, textarea, select { font: inherit; color: var(--fg); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* buttons and fields */
.btn { min-height: 44px; padding: 0 16px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 900; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger:hover { border-color: var(--bad); }
.icon { width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.icon:hover { border-color: var(--accent); }
.icon svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
label.f .hint { text-transform: none; letter-spacing: 0; font-weight: 300; font-size: 13px; }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=datetime-local], textarea, select {
  min-height: 44px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line);
  font-size: 1rem; font-weight: 400; text-transform: none; letter-spacing: 0; width: 100%;
}
textarea { resize: vertical; min-height: 84px; }
.row { display: flex; flex-wrap: wrap; gap: 14px; }
.row > * { flex: 1 1 160px; min-width: 0; }
.count { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px; float: right; }
.tag { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.tag.live { background: var(--live); border-color: var(--live); color: var(--bg); }
.tag.warn { color: var(--off); border-color: var(--off); }
.err { margin: 0; color: var(--bad); font-weight: 700; }
.note { color: var(--muted); font-size: .92rem; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* gate */
.gate { min-height: 100%; display: flex; flex-wrap: wrap; }
.gate .l { flex: 1 1 360px; background: var(--deep); padding: 48px 40px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; min-height: 240px; }
.gate .l h1 { font-size: clamp(2rem, 5vw, 3rem); color: #fff; }
.gate .l p { margin: 0; color: #bfe8e8; font-size: 1.05rem; }
.gate .r { flex: 1 1 360px; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.gate form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }

/* shell */
.shell { display: flex; min-height: 100%; }
aside { flex: 0 0 232px; background: var(--side); border-right: 1px solid var(--line); padding: 28px 0; display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100vh; }
aside .brand { padding: 0 24px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.badge { background: var(--accent); color: var(--bg); font-weight: 900; font-size: 11px; letter-spacing: .08em; padding: 4px 8px; }
aside .brand h2 { font-size: 1.4rem; }
nav { display: flex; flex-direction: column; }
nav button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 24px; background: none; border: 0; border-left: 3px solid transparent; color: var(--muted); font-weight: 700; cursor: pointer; text-align: left; }
nav button:hover { color: var(--fg); }
nav button.on { background: var(--surface); border-left-color: var(--accent); color: #fff; }
nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pub { margin: 0 16px; background: var(--surface); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.pub strong { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.dot.ok { background: var(--live); }
.pub button { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; min-height: 32px; }
aside .foot { margin-top: auto; padding: 0 24px; display: flex; flex-direction: column; gap: 12px; }
aside .foot button { background: none; border: 0; padding: 0; text-align: left; color: var(--muted); font-weight: 700; cursor: pointer; min-height: 32px; }
aside .foot button:hover { color: var(--fg); }
main { flex: 1; min-width: 0; padding: 36px clamp(16px, 4vw, 48px) 64px; }
.wrapin { max-width: 980px; display: flex; flex-direction: column; gap: 28px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 2rem; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--accent); padding: 12px 18px; font-weight: 700; z-index: 10; max-width: calc(100vw - 32px); }
.toast.bad { border-color: var(--bad); color: var(--bad); }

/* lists */
.group { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.item.past { opacity: .6; }
.date { flex: 0 0 56px; height: 56px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.date span { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.date b { font-weight: 900; font-size: 1.35rem; line-height: 1; }
.item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .body strong { font-weight: 900; overflow-wrap: anywhere; }
.item .body span { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.item .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.empty { border: 1px dashed var(--line); padding: 28px; text-align: center; color: var(--muted); }

/* form */
.formbox { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.formbox > form { flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--line); padding: 20px; min-width: 0; }
.formbox > .side { flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fieldset { border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; margin: 0; min-width: 0; }
.fieldset legend { padding: 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 0 14px; background: var(--bg); border: 1px solid var(--line); font-weight: 700; cursor: pointer; margin-left: -1px; }
.seg button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.ranges { display: flex; flex-direction: column; gap: 10px; }
.range { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.range > label { flex: 1 1 140px; }
.sw { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; min-height: 44px; }
.sw input { width: 22px; height: 22px; accent-color: var(--accent-fill); }

/* banner sample (matches the live page) */
.evbar { background: var(--deep); color: #fff; padding: 12px 16px; }
.ev { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-start; }
.ev + .ev { border-top: 1px solid rgba(255,255,255,.18); margin-top: 10px; padding-top: 10px; }
.evtag { background: #94e3e3; color: #0e1616; font-weight: 900; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; white-space: nowrap; }
.evtext { flex: 1 1 200px; min-width: 0; }
.evtext b { font-weight: 900; display: block; overflow-wrap: anywhere; }
.evtext span { font-weight: 300; display: block; overflow-wrap: anywhere; }
.evwhere { font-weight: 700; font-size: .92rem; overflow-wrap: anywhere; }
.sample { border: 1px solid var(--line); background: #fff; color: #222; }
.sample .ph { padding: 10px 16px; color: #666; font-size: .85rem; }

/* preview */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 40px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; cursor: pointer; font-size: .9rem; }
.chips button:hover { border-color: var(--accent); }
.chips button.brk { border-left: 3px solid var(--off); }
.chips button.evc { border-left: 3px solid var(--live); }
.chips button.cur { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.pvbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.pvbar label { flex: 0 1 260px; }
.stage { background: #0a1010; border: 1px solid var(--line); padding: 16px; display: flex; justify-content: center; }
iframe { border: 1px solid var(--line); background: var(--bg); width: 100%; height: 720px; }
iframe.phone { width: 400px; max-width: 100%; }

/* connect */
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 18px; padding: 0; margin: 0; list-style: none; max-width: 720px; }
.steps li { counter-increment: s; display: flex; gap: 14px; }
.steps li::before { content: counter(s); flex: none; width: 32px; height: 32px; background: var(--accent); color: var(--bg); font-weight: 900; display: flex; align-items: center; justify-content: center; }
.steps li > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
code { background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; font-size: .9em; }

@media (max-width: 820px) {
  .shell { flex-direction: column; }
  aside { position: static; height: auto; flex: none; padding: 16px 0; gap: 14px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav { flex-direction: row; overflow-x: auto; }
  nav button { border-left: 0; border-bottom: 3px solid transparent; padding: 0 16px; }
  nav button.on { border-bottom-color: var(--accent); }
  aside .foot { margin-top: 0; flex-direction: row; gap: 20px; }
  .item { flex-wrap: wrap; }
  .item .acts { width: 100%; justify-content: flex-start; }
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="l"><span class="badge" style="align-self:flex-start">WHOJ</span><h1>WHOJ Admin</h1><p>Events, breaks, and page previews for the WHOJ Quick Links site.</p></div>
  <div class="r">
    <form id="gateForm">
      <h2 style="font-size:1.6rem">Sign in</h2>
      <label class="f" for="pw">Password
        <input id="pw" type="password" autocomplete="current-password" required>
      </label>
      <p class="err" id="err" hidden>That password isn't right. Try again.</p>
      <button type="submit" class="btn primary">Unlock</button>
      <a href="./">← Back to Quick Links</a>
    </form>
  </div>
</div>

<div class="shell" id="app" hidden>
  <aside>
    <div class="brand"><span class="badge">WHOJ</span><h2>Admin</h2></div>
    <nav id="nav" aria-label="Admin sections">
      <button type="button" data-v="events"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events</button>
      <button type="button" data-v="breaks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 18 0H3zM12 12v8a2 2 0 0 0 4 0"/></svg>Breaks</button>
      <button type="button" data-v="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
    </nav>
    <div class="pub" id="pub"></div>
    <div class="foot">
      <a href="./">← Back to Quick Links</a>
      <button type="button" id="lockBtn">Lock</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="breaks.js"></script>
<script src="events.js"></script>
<script>
/* ---------- constants ---------- */
const KEY = "42a03c7096d17d62a3ef7b37940b86a07d4d6b1a069916d1091f759482be7d55";
const REPO = "GV-WHOJ/gv-whoj.github.io", BRANCH = "main", API = "https://api.github.com";
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v; /* only used for fixed icon markup */
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => { if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
}
const ICON = {
  edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  del: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};
const miNow = () => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Detroit", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${pad(p.hour % 24)}:${p.minute}`;
};
const today = () => miNow().slice(0, 10);
const shiftDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; const h12 = h % 12 || 12; return m ? `${h12}:${pad(m)}${ap}` : `${h12}${ap}`; };
const fmtDate = iso => { const d = new Date(iso + "T12:00:00Z"); return d.toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric", year: "numeric" }); };
const fmtShort = iso => { const d = new Date(iso + "T12:00:00Z"); return d.toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }); };
const newId = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastT;
function toast(msg, bad) { const t = $("toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 7000 : 3500); }

/* ---------- password gate (unchanged) ---------- */
const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
const getTok = () => { try { return localStorage.getItem("whojAdmin"); } catch (e) { return null; } };
$("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const h = await sha($("pw").value);
  if (h === KEY) { try { localStorage.setItem("whojAdmin", h); } catch (e) {} unlock(); }
  else { $("err").hidden = false; $("pw").select(); }
});
$("lockBtn").addEventListener("click", () => { try { localStorage.removeItem("whojAdmin"); localStorage.removeItem("whojGh"); } catch (e) {} location.reload(); });

/* ---------- GitHub publishing ---------- */
const ghTok = () => { try { return localStorage.getItem("whojGh") || ""; } catch (e) { return ""; } };
let ghOk = false, ghUser = "";
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
async function gh(path, opts) {
  const r = await fetch(API + path, Object.assign({ headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + ghTok(), "X-GitHub-Api-Version": "2022-11-28" } }, opts));
  if (!r.ok) {
    let m = ""; try { m = (await r.json()).message || ""; } catch (e) {}
    const err = new Error(r.status === 401 ? "GitHub did not accept the token. Reconnect publishing." : r.status === 403 || r.status === 404 ? "GitHub says this token can't write to the site. Check its repository and Contents permission." : r.status === 409 || r.status === 422 ? "The file changed on GitHub while you were editing. Reload and try again." : "GitHub error " + r.status + (m ? ": " + m : ""));
    err.status = r.status; throw err;
  }
  return r.json();
}
async function readFile(name) {
  const j = await gh(`/repos/${REPO}/contents/${name}?ref=${BRANCH}&_=${Date.now()}`);
  return { sha: j.sha, text: unb64(j.content) };
}
async function writeFile(name, text, sha, message) {
  const body = { message, content: b64(text), branch: BRANCH }; if (sha) body.sha = sha;
  const j = await gh(`/repos/${REPO}/contents/${name}`, { method: "PUT", body: JSON.stringify(body), headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + ghTok(), "Content-Type": "application/json" } });
  return j.content.sha;
}
const parseJs = text => { const w = (new Function("var window={};" + text + ";return window"))(); return w; };
const headerOf = text => { const m = text.match(/^\s*\/\*[\s\S]*?\*\//); return m ? m[0].trim() + "\n\n" : ""; };

/* data store: events.js and breaks.js */
const store = {
  events: { sha: null, head: "", list: [] },
  breaks: { sha: null, head: "", list: [] }
};
const stamp = "/* Edited from the Admin page. You can also edit this file by hand. */\n";
async function loadAll() {
  for (const [k, file, key] of [["events", "events.js", "EVENTS"], ["breaks", "breaks.js", "BREAKS"]]) {
    const f = await readFile(file);
    store[k].sha = f.sha; store[k].head = headerOf(f.text);
    const w = parseJs(f.text); store[k].list = Array.isArray(w[key]) ? w[key] : [];
  }
}
async function save(kind, message) {
  const s = store[kind], key = kind === "events" ? "EVENTS" : "BREAKS", file = kind + ".js";
  const items = s.list.map(o => JSON.stringify(o, null, 2).replace(/\n/g, "\n  "));
  const body = `window.${key} = [\n${items.map(i => "  " + i).join(",\n")}${items.length ? "\n" : ""}];\n`;
  const text = s.head + body;
  s.sha = await writeFile(file, text, s.sha, message);
}
async function reloadFresh() { try { await loadAll(); } catch (e) { toast(e.message, true); } }

/* ---------- state ---------- */
let view = "events", editing = null, brEditing = null, loaded = false, loadErr = "";
const state = { at: miNow(), phone: false, cat: "weekday", item: null };

/* ---------- views ---------- */
function setView(v) { view = v; editing = null; brEditing = null; render(); window.scrollTo(0, 0); }
$("nav").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (b) setView(b.dataset.v); });

function renderPub() {
  const p = $("pub"); p.replaceChildren();
  p.append(el("strong", {}, el("span", { class: "dot" + (ghOk ? " ok" : "") }), ghOk ? "Connected to GitHub" : "Not connected"));
  p.append(el("span", { class: "note" }, ghOk ? "Saving publishes to the live site." : "Connect to publish changes."));
  p.append(el("button", { type: "button", onclick: () => setView("connect") }, ghOk ? "Change token" : "Connect"));
}

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  renderPub();
  const m = $("main"); m.replaceChildren();
  const wrap = el("div", { class: "wrapin" }); m.append(wrap);
  if (view === "connect") return renderConnect(wrap);
  if (view === "preview") return renderPreview(wrap);
  if (!ghOk) {
    wrap.append(el("div", { class: "head" }, el("h1", {}, view === "events" ? "Events" : "Breaks")),
      el("div", { class: "empty" }, el("p", {}, "Connect publishing once so changes can be saved to the site."), el("button", { class: "btn primary", type: "button", onclick: () => setView("connect") }, "Connect publishing")));
    return;
  }
  if (!loaded) { wrap.append(el("p", { class: "note" }, loadErr || "Loading from GitHub…")); return; }
